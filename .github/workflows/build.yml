name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is committed without the executable bit (created on Windows)
      - run: chmod +x gradlew

      - name: Build, check formatting and test
        run: ./gradlew build shadowJar

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qupath-extension-guided-tutorials
          path: build/libs/*-all.jar

      # The version lives in build.gradle.kts; the tag must match it exactly.
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          jar=$(ls build/libs/*-all.jar)
          tag_version="${GITHUB_REF_NAME#v}"
          case "$jar" in
            *"-${tag_version}-all.jar") ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match jar $jar - set version in build.gradle.kts to $tag_version"; exit 1 ;;
          esac

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*-all.jar
          generate_release_notes: true
